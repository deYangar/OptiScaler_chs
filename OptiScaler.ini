[Upscalers]
; -------------------------------------------------------
; 为 Dx11 游戏选择超分辨率技术
; fsr22 (原生 DX11), fsr31 (原生 DX11), xess (原生 DX11, 仅限 Arc), xess_12 (dx11on12), fsr21_12 (dx11on12), fsr22_12 (dx11on12), ffx_12 (FSR 2.3; 3.1; 4.x), dlss - 默认 (auto) 为 fsr22
Dx11Upscaler=auto
; 为 Dx12 游戏选择超分辨率技术
; xess, fsr21, fsr22, ffx (FSR 2.3; 3.1; 4.x), dlss
; 默认 (auto) 为：支持 DLSS 的显卡用 DLSS，支持 FSR4 的显卡用 FSR4，否则用 XeSS
Dx12Upscaler=auto
; 为 Vulkan 游戏选择超分辨率技术
; fsr21 (原生 VK), fsr22 (原生 VK), ffx (原生 FSR 2.3; 3.1), xess (原生 VK), fsr21_12 (VKon12), ffx_12 (FSR 2.3; 3.1; 4.x), dlss - 默认 (auto) 为 fsr22
VulkanUpscaler=auto

[FrameGen]
; -------------------------------------------------------
; 启用放大镜
; 默认情况下，仅在菜单可见时可见并跟随光标
; true 或 false - 默认 (auto) 为 true
Enabled=auto
; 选择帧生成输入/来源
; dlssg    - 可用于任何 FG 输出。开箱即用地支持 Hudless。仅限于使用 Streamline 和 DLSSG 的游戏
; nvngxfg  - 仅限于 FSR 3 FG（使用 DLSS Enabler 的 dll 实现 MFG）。游戏需要支持 DLSSG。开箱即用地支持 Hudless。使用 Streamline swapchain 进行节奏控制
; fsrfg    - 可用于任何 FG 输出。开箱即用地支持 Hudless
; upscaler - 必须启用超分辨率技术。可用于任何 FG 输出，但与部分输出配合可能不完美。为防止 UI 闪烁，需要 Hudfix
; fsrfg30  - 可用于任何 FG 输出。开箱即用地支持 Hudless
; nofg, dlssg, nvngxfg, fsrfg, upscaler, fsrfg30 - 默认 (auto) 为 nofg
FGInput=auto
; 选择帧生成输出
; fsrfg          - 需要 amd_fidelityfx_dx12.dll 或 amd_fidelityfx_loader_dx12.dll + amd_fidelityfx_framegeneration_dx12.dll
; xefg           - 需要 libxess_fg.dll 和 libxell.dll
; nvngxfg        - 需要 dlssg_to_fsr3_amd_is_better.dll 或 dlss-enabler-headless.dll
; dlssg          - 需要 'OptiScaler/streamline' 文件夹内的 streamline dll + nvngx_dlssg.dll
; dlssgwithnvngx - 需要 dlssg_to_fsr3_amd_is_better.dll 或 dlss-enabler-headless.dll + 'OptiScaler/streamline' 文件夹内的 streamline dll
; nofg, fsrfg, xefg, nvngxfg, dlssg, dlssgwithnvngx - 默认 (auto) 为 nofg
FGOutput=auto
; 选定的 FG Nvngx 替换
; Nvngx FG 是较低层级的 DLSSG 提供者。需要将 FGInput=NvngxFG 或 FGOutput=DLSSG 用于此设置才能生效
; 例如，要在仅具有超分辨率技术（超分）的游戏中启用 Nukems：FGInput=upscaler, FGOutput=dlssg, FGNvngxReplacement=Nukems
; 要在已支持 DLSSG 的游戏中启用 Arturs：FGInput=nvngxfg, FGOutput=auto, FGNvngxReplacement=Arturs
; None      - 无替换
; Nukems    - 需要 dlssg_to_fsr3_amd_is_better.dll, FSR 3 FG
; Arturs    - 需要 dlss-enabler-headless.dll, FSR 3 MFG
; FFX       - 需要 amd_fidelityfx_dx12.dll 或 amd_fidelityfx_loader_dx12.dll + amd_fidelityfx_framegeneration_dx12.dll, FSRFG 3 或 4
; None, Nukems, Arturs, FFX - 默认 (auto) 是 None
FGNvngxReplacement=auto
; 帧时间来源，会影响帧节奏
; 0: 输入（DLSSG/FSRFG/OptiFG）| 1: Present 调用间隔时间 | 2: 零（仅限 XeFG）
; true 或 false - 默认 (auto) 为 0
FTInput=auto
; 启用 FSR3.X 超分辨率技术的调试视图
; true 或 false - 默认 (auto) 为 false
DebugView=auto
; 在 FG 上绘制 UI，需要 Hudless 和 UI 纹理，主要用于 FSR FG
; true 或 false - 默认 (auto) 为 false
DrawUIOverFG=auto
; 设置提供的 UI 纹理的类型，与 DrawUIOverFG + FSR FG 配合时会改变 UI 的外观
; true 或 false - 默认 (auto) 为 true
UIPremultipliedAlpha=auto
; 禁用发送到 DLSSG 的 hudless 资源
; 某些 DispatchFlags 集合可能需要，请参考上述链接
; true 或 false - 默认 (auto) 为 false
DisableHudless = auto
; 控制 UI 纹理，即使 FG 来源提供了一份
; true 或 false - 默认 (auto) 为 true
DisableUI=auto
; 忽略来自 FG 输入的 Reset 信号
; true 或 false - 默认 (auto) 为 false
SkipReset=auto
; 定义 FG 矩形
; 整数值 - 默认 (auto) 为整个屏幕
RectLeft=auto
RectTop=auto
RectWidth=auto
RectHeight=auto
; FG 允许领先于游戏的最大帧数
; 可能阻止 FG 开/关切换，但也可能导致问题
; 1 到 3 - 默认 (auto) 为 1
AllowedFrameAhead=auto
; 始终将 Depth 标记为 ValidNow
; 会使用更多显存，但 Uniscaler 需要此项
; true 或 false - 默认 (auto) 为 false
DepthValidNow=auto
; 始终将 Velocity 标记为 ValidNow
; 会使用更多显存，但 Uniscaler 需要此项
; true 或 false - 默认 (auto) 为 false
VelocityValidNow=auto
; 始终将 Hudless 标记为 ValidNow
; 会使用更多显存，但 Uniscaler 需要此项
; true 或 false - 默认 (auto) 为 false
HudlessValidNow=auto
; 如果来源标记了多个 hudless，只使用第一个
; true 或 false - 默认 (auto) 为 false
OnlyAcceptFirstHudless=auto
; 保留并防止释放 FG swapchain
; 释放 swapchain 时可能防止崩溃
; true 或 false - 默认 (auto) 为 true
PreserveSwapChain=auto
; 跳过对 swapchain 的 ResizeBuffers 调用
; 如果新旧描述相同
; 防止 ResizeBuffers 调用后崩溃
; true 或 false - 默认 (auto) 为 true
SkipResizeBuffers=auto
; 通常在 ResizeBuffers 调用后，swapchain 缓冲区
; 应处于 COMMON 状态，当启用此选项时
; OptiScaler 会在跳过 ResizeBuffers 调用时
; 尝试设置 swapchain 缓冲区状态
; 可能导致崩溃，也可能修复崩溃
; true 或 false - 默认 (auto) 为 false
ModifyBufferState=auto
; 通常在 ResizeBuffers 调用后，swapchain 当前索引
; 应为 0，当启用此选项时
; OptiScaler 会通过调用 present 尝试设置 swapchain 索引
; 直到索引达到 0
; 可能导致崩溃，也可能修复崩溃
; true 或 false - 默认 (auto) 为 false
ModifySCIndex=auto
; 从 UI 中截断透明度以帮助插值
; 仅适用于 FSR FG 输出和 NvngxFG
; 0.0 - 1.0 - 默认 (auto) 为 0.0，除非已知需要修复特定游戏
HudCutoff=auto

[FSRFG]
; -------------------------------------------------------
; 启用 FSR3.1 帧生成撕裂线
; true 或 false - 默认 (auto) 为 false
DebugTearLines=auto
; 启用 FSR3.1 帧生成插值跳过线
; true 或 false - 默认 (auto) 为 false
DebugResetLines=auto
; 启用 FSR3.1 帧生成节奏线
; true 或 false - 默认 (auto) 为 false
DebugPacingLines=auto
; 启用异步 FSR3.1 帧生成
; true 或 false - 默认 (auto) 为 false
AllowAsync=auto
; 启用 FG swapchain present 调用的互斥锁
; 禁用可能提高性能，但牺牲稳定性
; true 或 false - 默认 (auto) 为 true
UseMutexForSwapchain=auto
; 帧节奏调优
; -------------------------------------------------------
; 启用自定义帧节奏调优参数
; true 或 false - 默认 (auto) 为 true
FramePacingTuning=auto
; 此信息来自：
; https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/blob/54fbaafdc34716811751bea5032700e78f5a0f33/ffx-api/include/ffx_api/ffx_api_types.h#L197
;
; 默认调优
; safetyMarginInMs==0.1ms 且 varianceFactor==0.1。
;
; 调优方案 A
; safetyMarginInMs==0.75ms 且 varianceFactor==0.1。
;
; 调优方案 B
; safetyMarginInMs==0.01ms 且 varianceFactor==0.3。
;
; 如果使用 FG 时，游戏帧率在从复杂场景逐渐过渡到简单场景后运行在异常低的帧率，
; 可以尝试设置"调优方案 B"，以稍高的方差为代价恢复丢失的 FPS。
;
; OptiScaler 默认使用调优方案 B
; 帧节奏调优
; 设置安全边际
; float - 默认 (auto) 为 0.01
FPTSafetyMarginInMs=auto
; 帧节奏调优
; 设置方差因子
; 0.0 - 1.0 - 默认 (auto) 为 0.3
FPTVarianceFactor=auto
; 帧节奏调优
; 允许节奏自旋锁休眠，应降低 CPU 占用
; 可能导致 FPS 上升缓慢
; true 或 false - 默认 (auto) 为 false
FPTHybridSpin=auto
; 帧节奏调优
; FPTHybridSpin 为 true 时的自旋时长。以计时器分辨率单位计
; 不建议低于 2，否则会导致频繁过冲
; uint - 默认 (auto) 为 2
FPTHybridSpinTime=auto
; 帧节奏调优
; 允许使用 WaitForSingleObject 而不是自旋等待 fence 值
; true 或 false - 默认 (auto) 为 false
FPTWaitForSingleObjectOnFence=auto
; 启用 FSR-FG Redstone 水印
; true 或 false - 默认 (auto) 为 false
EnableWatermark=auto

[XeFG]
; -------------------------------------------------------
; 跳过 XeFG 的预 ini 检查
; 可能导致画质变差或崩溃！
; true 或 false - 默认 (auto) 为 false
IgnoreInitChecks=auto
; -------------------------------------------------------
; 设置插值帧数（MFG）
; 1 = 2X | 2 = 3X | 3 = 4X | 4 = 5X | 5 = 6X
; true 或 false - 默认 (auto) 为 1
InterpolationCount=auto
; 强制向初始化标志添加 INVERTED_DEPTH
; true 或 false - 默认 (auto) 为 DLSS 默认值
DepthInverted=auto
; 禁用 UI 插值
; 仅在提供 hudless 时有效
; true 或 false - 默认 (auto) 为 false
UIComposition=auto
; XeFG JitteredMV 标志
; true 或 false - 默认 (auto) 为 false
JitteredMV=auto
; XeFG HighResMV 标志
; true 或 false - 默认 (auto) 为 false
HighResMV=auto
; 启用 FSR3.X 超分辨率技术的调试视图
; true 或 false - 默认 (auto) 为 false
DebugView=auto
; 强制使用无边框模式而不是独占全屏
; 可能在模式切换时导致稳定性问题
; 或当独占全屏模式小于显示分辨率时
; 导致画质问题
; true 或 false - 默认 (auto) 为 false
ForceBorderless=auto

[DLSSG]
; -------------------------------------------------------
; 设置插值帧数（MFG）
; 1 = 2X | 2 = 3X | 3 = 4X | 4 = 5X | 5 = 6X
; true 或 false - 默认 (auto) 为 1
InterpolationCount=auto
; 默认 (auto) 为 true
UseGamesReflexMarkers=auto
; 用于覆盖发送给 SL 的游戏值，可能是 Nvngx FG，也可能是使用真实 DLSSG 时的 noFG
; 默认 (auto) 为不覆盖
OverrideInterpolationCount=auto
; 尝试强制动态 MFG。需要 Nvidia Blackwell 或任何 AMD/Intel
; 默认 (auto) 为 false
OverrideForceDMFG=auto
; 设置动态多帧生成的 FPS 目标
; 非零时，你将无法手动调整 FG 倍率
; 需要启用 DMFG
; 默认 (auto) 为 0.0（显示器的刷新率）
FramerateTargetDMFG=auto

[OptiFG]
; -------------------------------------------------------
; 禁用 HUDFix 资源跟踪
; 同时降低与处理 HUD 元素的
; ML 帧生成器配合使用时的 CPU 开销
; true 或 false - 默认 (auto) 为 false
DisableHUDFix=auto
; 启用帧生成的 HUDFix Hudless 跟踪
; 可能导致崩溃，尤其是与 Async 配合时
; true 或 false - 默认 (auto) 为 false
HUDFix=auto
; 延迟 HUDless 图像捕获
; 可能导致崩溃，尤其是设置过高时！
; 大于 0 的整数值 - 默认 (auto) 为 1
HUDLimit=auto
; 扩展 HUDless 检查以支持更多图像格式
; 可能导致崩溃和卡顿。
; true 或 false - 默认 (auto) 为 false
HUDFixExtended=auto
; 不使用 CreateRenderTargetView 进行资源跟踪
; true 或 false - 默认 (auto) 为 false
HudfixDisableRTV=auto
; 不使用 CreateShaderResourceView 进行资源跟踪
; true 或 false - 默认 (auto) 为 false
HudfixDisableSRV=auto
; 不使用 CreateUnorderedAccessView 进行资源跟踪
; true 或 false - 默认 (auto) 为 false
HudfixDisableUAV=auto
; 不使用 OMSetRenderTargets 进行资源跟踪
; true 或 false - 默认 (auto) 为 false
HudfixDisableOM=auto
; 不使用 SetComputeRootDescriptorTable 进行资源跟踪
; true 或 false - 默认 (auto) 为 true
HudfixDisableSCR=auto
; 不使用 SetGraphicsRootDescriptorTable 进行资源跟踪
; true 或 false - 默认 (auto) 为 true
HudfixDisableSGR=auto
; 不使用 DrawInstanced 进行资源跟踪
; true 或 false - 默认 (auto) 为 false
HudfixDisableDI=auto
; 不使用 DrawIndexedInstanced 进行资源跟踪
; true 或 false - 默认 (auto) 为 false
HudfixDisableDII=auto
; 不使用 Dispatch 进行资源跟踪
; true 或 false - 默认 (auto) 为 false
HudfixDisableDispatch=auto
; 防止 swapchain 缓冲区被用作 Hudless
; 可能帮助修复覆盖层问题，但也可能降低兼容性
; true 或 false - 默认 (auto) 为 false
HUDFixDontUseSwapchainBuffers=auto
; 将 Hudless 的分辨率检查放宽 32 像素
; 帮助使用黑边分辨率和屏幕比例的游戏（例如《巫师3》）
; true 或 false - 默认 (auto) 为 false
HUDFixRelaxedResolutionCheck=auto
; 启用着色器执行前的资源捕获。
; 提高 hudless 捕获成功率，但可能捕获不必要的资源。
; true 或 false - 默认 (auto) 为 false
HUDFixImmediate=auto
; 无论 Hudfix 设置如何，始终启用资源跟踪
; 可能导致性能问题，但禁用可能导致稳定性问题
; true 或 false - 默认 (auto) 为 false
AlwaysTrackHeaps=auto
; 使用分片而不是单一互斥锁来跟踪资源
; 可能在重度多线程游戏中提高性能
; true 或 false - 默认 (auto) 为 false
UseShards=auto
; 阻止不常用的资源用作 hudless
; 以防止闪烁和其他问题
; true 或 false - 默认 (auto) 为 false
ResourceBlocking=auto
; -------------------------------------------------------
; 修复部分游戏（主要是非 UE）在 AMD GPU 和 Windows 下的损坏画面
; 可能导致卡顿，因此最好仅在必要时使用，且按说明使用
; true 或 false - 默认 (auto) 为 false
MakeDepthCopy=auto
; 根据 DepthScaleMax 值缩放深度缓冲区
; 修复 DLSS-D + UE 的深度缓冲区信息损坏
; true 或 false - 默认 (auto) 为 false
EnableDepthScale=auto
; EnableDepthScale 的缩放值
; 深度值将除以该值
; float - 默认 (auto) 为 10000.0
DepthScaleMax=auto
; 复制一份运动矢量用于 Hudfix FG 调用
; 设置为 false 很可能导致偶发花屏
; true 或 false - 默认 (auto) 为 true
MakeMVCopy=auto
; 翻转 Depth 和 Velocity 纹理
; 应修复 OptiFG 与 Unity 游戏的问题
; true 或 false - 默认 (auto) 为 false
ResourceFlip=auto
; 根据插值区域翻转 Depth 和 Velocity 纹理
; 应修复 OptiFG 与 Unity 游戏的问题
; true 或 false - 默认 (auto) 为 false
ResourceFlipOffset=auto
; 始终捕获 FSR-FG 3.1 swapchain 并与所选输出交换
; 应修复创建但不使用 FSR-FG swapchain 的
; 游戏的双重 present 调用问题（《寂静岭 f》）
; true 或 false - 默认 (auto) 为 false
AlwaysCaptureFSRFGSwapchain=auto

[Inputs]
; -------------------------------------------------------
; OptiScaler 将挂钩 (nvngx.dll) 并使用 Dlss 输入
; true 或 false - 默认 (auto) 为 true
EnableDlssInputs=auto
; OptiScaler 将挂钩 (libxess.dll) 并使用 XeSS 输入
; true 或 false - 默认 (auto) 为 true
EnableXeSSInputs=auto
; OptiScaler 将挂钩 Fsr2 输入
; true 或 false - 默认 (auto) 为 true
EnableFsr2Inputs=auto
; OptiScaler 将挂钩 Fsr2 Dx11 输入而不是 Dx12 输入
; true 或 false - 默认 (auto) 为 false
UseFsr2Dx11Inputs=auto
; OptiScaler 将挂钩 Fsr2 Vulkan 输入而不是 Dx11 和 Dx12 输入
; true 或 false - 默认 (auto) 为 false
UseFsr2VulkanInputs=auto
; OptiScaler 将使用 Fsr2 输入
; true 或 false - 默认 (auto) 为 true
UseFsr2Inputs=auto
; 尝试通过模式匹配查找 FSR2 方法
; 会减慢游戏加载速度
; true 或 false - 默认 (auto) 为 false
Fsr2Pattern=auto
; OptiScaler 将挂钩 Fsr3 输入
; true 或 false - 默认 (auto) 为 true
EnableFsr3Inputs=auto
; OptiScaler 将使用 Fsr3 输入
; true 或 false - 默认 (auto) 为 true
UseFsr3Inputs=auto
; 尝试通过模式匹配查找 FSR3 方法
; 会减慢游戏加载速度
; true 或 false - 默认 (auto) 为 false
Fsr3Pattern=auto
; OptiScaler 将挂钩 FidelityFX (amd_fidelityfx_dx12.dll) API 输入
; true 或 false - 默认 (auto) 为 true
EnableFfxInputs=auto
; OptiScaler 将使用 FidelityFX API 输入
; true 或 false - 默认 (auto) 为 true
UseFfxInputs=auto
; 启用游戏 FSR3.1 超分辨率技术与 OptiScaler 所选超分辨率技术之间的热切换
; true 或 false - 默认 (auto) 为 false
EnableHotSwapping=auto

[FSRFGInputs]
; -------------------------------------------------------
; 不使用 ffxConfig 中设置的 Hudless
; true 或 false - 默认 (auto) 为 false
SkipConfigForHudless=auto
; 不使用 ffxDispatch 中设置的 Hudless
; true 或 false - 默认 (auto) 为 false
SkipDispatchForHudless=auto

[Framerate]
; -------------------------------------------------------
; 尽可能使用 Reflex 的帧率限制
; 包括任何替代 Reflex 的技术，如 XeLL 或 AntiLag 2
; float - 默认 (auto) 为 0.0（禁用）
FramerateLimit=auto

[XeSS]
; -------------------------------------------------------
; 在初始化前构建 XeSS pipeline
; true 或 false - 默认 (auto) 为 true
BuildPipelines=auto
; 在初始化前为 XeSS 创建堆对象
; true 或 false - 默认 (auto) 为 true
CreateHeaps=auto
; 选择 XeSS 网络模型
; 目前似乎没有任何作用
; 0 = KPSS | 1 = Splat | 2 = Model 3 | 3 = Model 4 | 4 = Model 5 | 5 = Model 6
; 默认 (auto) 为 0
NetworkModel=auto

[FSR]
; -------------------------------------------------------
; 为 FSR 和 FSR FG 设置相机垂直 FOV 值
; 0.0 到 180.0 - 默认 (auto) 为 60.0
VerticalFov=auto
; 如果未定义垂直 FOV，将用于计算垂直 FOV
; 0.0 到 180.0 - 默认 (auto) 为 off
HorizontalFov=auto
; 为 FSR 和 FSR FG 设置相机近平面值
; 0.0 到最大浮点值 - 默认 (auto) 为 0.1
CameraNear=auto
; 为 FSR 和 FSR FG 设置相机远平面值
; 0.0 到最大浮点值 - 默认 (auto) 为 10000.0
CameraFar=auto
; 启用从 FSR2/3 或 FFX 输入接收的相机值（近平面、远平面、FOV）
; true 或 false - 默认 (auto) 为 true
UseFsrInputValues=auto
; 启用 FSR3.X 超分辨率技术的调试视图
; true 或 false - 默认 (auto) 为 false
DebugView=auto
; 选择 FSR3.X/4 的超分辨率后端
; 0 = FSR 4.0.2 | 1 = FSR 3.1.5 | 2 = FSR 2.3.4
; 取决于 GPU - 默认 (auto) 为 0 - RDNA4 用 FSR4，其余用 FSR3
UpscalerIndex=auto
; 选择 FFX 的 FG 后端
; 0 = FSR 4.0.0 | 1 = FSR 3.1.6
; 取决于 GPU - 默认 (auto) 为 0 - RDNA4 用 FSR4，其余用 FSR3
FGIndex=auto
; 为 FSR3.1.1 及以上版本设置速度因子
; 0.0f 的值可以提高亮像素的时间稳定性。
; 0.0 到 1.0 - 默认 (auto) 为 1.0
VelocityFactor=auto
; 为 FSR3.1.4 及以上版本设置反应性缩放
; 用于开发目的，测试向 reactive mask 写入更大的值是否减少重影
; 0.0 到无穷 - 默认 (auto) 为 1.0
ReactiveScale=auto
; 为 FSR3.1.4 及以上版本设置着色缩放
; 增加此值会在读取时缩放 fsr3.1 计算的着色变化值，以获得更高的反应性。
; 0.0 到无穷 - 默认 (auto) 为 1.0
ShadingScale=auto
; 为 FSR3.1.4 及以上版本设置每帧累积量
; 对应于在发生去遮挡的像素坐标处，或 reactive mask 值 > 0.0f 时，每帧添加的累积量。
; 减小此值并将重影物体（即无 mv）绘制到接近 1.0f 的 reactive mask 上，可以减少时间重影。
; 减小此值可能导致更多细长特征像素闪烁。
; 0.0 到 1.0 - 默认 (auto) 为 0.333
AccAddPerFrame=auto
; 为 FSR3.1.4 及以上版本设置最小去遮挡累积量
; 增加此值可能减少经常互相去遮挡的摇摆细长物体周围的白色像素时间闪烁。
; 过高可能导致重影增加。足够负的值意味着对于第 N 帧中被去遮挡的像素坐标，
; 从第 N+2 帧开始添加 fAccumulationAddedPerFrame。
; -1.0 到 1.0 - 默认 (auto) 为 -0.333
MinDisOccAcc=auto
; 使用原始 DLSS reactive mask 作为透明度遮罩
; true 或 false - 默认 (auto) 为 true
UseReactiveMaskForTransparency=auto
; 与 FSR 配合使用时对 DLSS reactive mask 应用的偏置
; 值越高，对新帧的偏置越大
; 0.0 - 0.9 - 默认 (auto) 为 0.45
DlssReactiveMaskBias=auto
; 强制 Opti 尝试使用特定的 FSR 4 模型
; 不要自欺欺人地在实际上不支持的 GPU 上强制 FP8，驱动有 FSR 3 回退
; 0 = 不覆盖 | 1 = FP8 | 2 = INT8
; 从 0 到 2 - 默认 (auto) 为 0
Fsr4ForceModel=auto
; 选择内部 FSR4 预设
; 0 = FSR Native AA, 1 = Ultra Quality/Quality, 2 = Balanced, 3 = Performance, 4 = DRS, 5 = Ultra Performance
; 从 0 到 5 - 默认 (auto) 为游戏默认
Fsr4Preset=auto
; 启用 FSR4 水印
; true 或 false - 默认 (auto) 为 false
Fsr4EnableWatermark=auto
; 阻止 OptiScaler 加载 amdxc64.dll
; true 或 false - 默认 (auto) 为 false
Fsr4DoNotLoadAmdxc64=auto
; 表示输入颜色资源使用非线性的色彩空间
; 可能提高 FSR4 的画质
; true 或 false - 默认 (auto) 为 false
FsrNonLinearColorSpace=auto
; 表示输入颜色资源包含感知 sRGB 颜色
; 可能提高 FSR4 的画质
; true 或 false - 默认 (auto) 为 false
FsrNonLinearSRGB=auto
; 表示输入颜色资源包含感知 PQ 颜色
; 可能提高 FSR4 的画质
; true 或 false - 默认 (auto) 为 false
FsrNonLinearPQ=auto
; 更新 DirectX 12 Agility SDK
; 允许在 Windows 10 的旧游戏（如《赛博朋克 2077》）中使用 FSR4
; 你必须将 D3D12_OptiScaler 文件夹复制到 OptiScaler 文件夹中！
; true 或 false - 默认 (auto) 为 false
FsrAgilitySDKUpgrade=auto

[DLSS]
; -------------------------------------------------------
; 启用放大镜
; 默认情况下，仅在菜单可见时可见并跟随光标
; true 或 false - 默认 (auto) 为 true
Enabled=auto
; -------------------------------------------------------
; 设为 true 以启用自定义渲染预设覆盖
; true 或 false - 默认 (auto) 为 false
RenderPresetOverride=auto
; 各质量设置的渲染预设
; 取决于 DLSSD 版本，但最新的顺序是
; 0 = Default | 1 = A | 2 = B | 3 = C | 4 = D | 5 = E
; 默认 (auto) 为 0
RenderPresetForAll=auto
RenderPresetDLAA=auto
RenderPresetUltraQuality=auto
RenderPresetQuality=auto
RenderPresetBalanced=auto
RenderPresetPerformance=auto
RenderPresetUltraPerformance=auto
; 对 NGX 使用通用 appid，修复 OptiScaler 预设覆盖在部分游戏中无效的问题
; true 或 false - 默认 (auto) 为 false
UseGenericAppIdWithDlss=auto

[DLSSD]
; -------------------------------------------------------
; 设为 true 以启用自定义渲染预设覆盖
; true 或 false - 默认 (auto) 为 false
RenderPresetOverride=auto
; 各质量设置的渲染预设
; 取决于 DLSSD 版本，但最新的顺序是
; 0 = Default | 1 = A | 2 = B | 3 = C | 4 = D | 5 = E
; 默认 (auto) 为 0
RenderPresetForAll=auto
RenderPresetDLAA=auto
RenderPresetUltraQuality=auto
RenderPresetQuality=auto
RenderPresetBalanced=auto
RenderPresetPerformance=auto
RenderPresetUltraPerformance=auto

[NvngxFG]
; -------------------------------------------------------
; 修复部分游戏（主要是非 UE）在 AMD GPU 和 Windows 下的损坏画面
; 可能导致卡顿，因此最好仅在必要时使用，且按说明使用
; true 或 false - 默认 (auto) 为 false
MakeDepthCopy=auto
; 接受任何标志集，例如 0x14100000
; 参考 https://github.com/artur-graniszewski/dlss-enabler-main/blob/a92464d468eb0d91ae17befa66c6bf6229f20b9f/Utils/DlssgProxy.cpp#L1033
; 任何标志集 - 默认 (auto) 为 0x10000000 (IGNORE_UI_TEXTURE)
DispatchFlags = auto
; 控制设置给 DLSSG.ShowDebug 的值
; 似乎只显示插值帧
; true 或 false - 默认 (auto) 为 false
ShowDebug = auto
; 禁用发送到 DLSSG 的 hudless 资源
; 某些 DispatchFlags 集合可能需要，请参考上述链接
; true 或 false - 默认 (auto) 为 false
DisableHudless = auto

[Libraries]
; -------------------------------------------------------
; OptiScaler 检查以下 dll 文件的主文件夹
; 默认是 .\OptiScaler
OptiDllPath=auto
; 以下选项用于覆盖每个 dll 的路径
; -----------------------------------------
; nvngx.dll 或 _nvngx.dll
NvngxPath=auto
; nvngx_dlss.dll
NvngxDlssPath=auto
; nvapi64.dll 或 fakenvapi.dll
NvapiPath=auto
; amd_fidelityfx_dx12.dll 或 amd_fidelityfx_loader_dx12.dll
FfxDx12Path=auto
; amd_fidelityfx_upscaler_dx12.dll
FfxDx12SRPath=auto
; amd_fidelityfx_framegeneration_dx12.dll
FfxDx12FGPath=auto
; amd_fidelityfx_denoiser_dx12.dll
FfxDx12RRPath=auto
; amd_fidelityfx_radiancecache_dx12.dll
FfxDx12RCPath=auto
; amd_fidelityfx_vk.dll
FfxVkPath=auto
; libxess.dll
XeSSPath=auto
; libxess_fg.dll
XeFGPath=auto
; libxell.dll
XeLLPath=auto
; libxess_dx11.dll
XeSSDx11Path=auto
; 此路径将在初始化期间添加到 Nvngx 的路径中
NvngxFeaturePath=auto

[Menu]
; -------------------------------------------------------
; 启用新版覆盖层 ImGui 菜单
; 没有此选项，OptiScaler 将禁用所有 FG 功能
; true 或 false - 默认 (auto) 为：OptiScaler 是 nvngx.dll 时为 false，否则为 true
OverlayMenu=auto
; 游戏内 ImGui 菜单缩放
; 0.5 到 2.0 - 默认 (auto) 为 1.0，低于 900p 时会变小
Scale=auto
; 打开菜单的快捷键
; 所有键码值可以查看此地址
; 将 Description 与 key Value 匹配
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数值 - 默认 (auto) 为 0x2D，即 VK_INSERT/Insert 键，之前的默认键是 0x24 -> VK_HOME/Home 键
; 例如想使用 VK_BACK/Backspace 键，即 0x08 - 设置 ShortcutKey=0x08
; -1 -> 无快捷键
ShortcutKey=auto
; 将缩放比例限制扩展到 0.1 - 6.0
; true 或 false - 默认 (auto) 为 false
ExtendedLimits=auto
; 为菜单使用高质量字体
; 可能使用更多显存
; 如果看到黑色覆盖层或在 Vulkan 下遇到菜单相关崩溃，请尝试禁用
; true 或 false - 默认 (auto) 为 true
UseHQFont=auto
; 只控制字体大小，不影响其他样式元素
; 主要在使用 TTFFontPath 自定义字体时有用
; float - 默认 (auto) 为 14.0
FontSize=auto
; 用作 HQ 字体的字体路径，需要 UseHQFont=true
; 最好使用等宽字体
; 示例路径：C:\\Windows\\Fonts\\comic.ttf
; 默认 (auto) 为 OptiScaler 内置的 Hack-Regular
TTFFontPath=auto
; 禁用启动 Splash 消息
; true 或 false - 默认 (auto) 为 false
DisableSplash=auto
; 启用 FPS 覆盖层
; true 或 false - 上游默认 (auto) 为 false（汉化版预置为 true，开箱即用）
ShowFps=true
; 游戏内 FPS 覆盖层缩放
; 0.5 到 2.0 - 默认 (auto) 为与菜单相同缩放
FpsScale=auto
; FPS 覆盖层位置
; 0 = 左上 | 1 = 右上 | 2 = 左下 | 3 = 右下
; 0 到 3 - 默认 (auto) 为 0
FpsOverlayPos=auto
; FPS 覆盖层类型
; 0 = 仅 FPS | 1 = 简单 | 2 = 详细 | 3 = 详细 + 图表 | 4 完整 | 5 完整 + 图表 | 6 Reflex 时序
; 0 到 6 - 上游默认 (auto) 为 0（汉化版预置为 3：详细 + 图表）
FpsOverlayType=3
; FPS 覆盖层快捷键
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数值 - 默认 (auto) 为 0x21 -> VK_PRIOR/Page up 键
; -1 -> 无快捷键
FpsShortcutKey=auto
; FPS 覆盖层类型循环快捷键
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数值 - 默认 (auto) 为 0x22 -> VK_NEXT/Page down 键
; -1 -> 无快捷键
FpsCycleShortcutKey=auto
; 启用横向 FPS 覆盖层布局
; true 或 false - 默认 (auto) 为 false
FpsOverlayHorizontal=auto
; FPS 覆盖层背景透明度
; 0.0 到 1.0 - 默认 (auto) 为 0.4
FpsOverlayAlpha=auto
; FG 启用/禁用快捷键
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数值 - 默认 (auto) 为 0x23 -> VK_END/End 键
; -1 -> 无快捷键
FGShortcutKey=auto
; 覆盖层使用主题颜色
; true 或 false - 默认 (auto) 为 false
OverlaysUseTheme=auto
; 为菜单启用浅色主题
; true 或 false - 默认 (auto) 为 false
LightTheme=auto
; 菜单的强调色
; 菜单强调色的 R/G/B 浮点颜色值
; 0.0 到 1.0 - 默认 (auto) R: 0.0, G: 0.4, B: 0.77（蓝色）
AccentColorR=auto
AccentColorG=auto
AccentColorB=auto
; 菜单的背景色
; 菜单强调色的 R/G/B 浮点颜色值
; 0.0 到 1.0 - 默认 (auto) R: 0.0, G: 0.0, B: 0.0（黑色）
BGColorR=auto
BGColorG=auto
BGColorB=auto
; 菜单的背景透明度
; 0 为完全透明，1 为完全不透明
; 0.0 到 1.0 - 默认 (auto) 0.99
BGColorA=auto

[Spoofing]
; -------------------------------------------------------
; 要伪装的 VendorID
; 0x10de = Nvidia | 0x8086 = Intel | 0x1002 = AMD
; 整数值 - 默认 (auto) 为 0x10de
SpoofedVendorId=auto
; 要伪装的 DeviceID
; 0x2684 = 4090 | 0xE20B = B580 | 0x7550 9070 XT
; 整数值 - 默认 (auto) 为 0x2684 (4090)
SpoofedDeviceId=auto
; 要伪装的显卡 VendorID（伪装目标）
; 整数值 - 默认 (auto) 为全部
TargetVendorId=auto
; 要伪装的显卡 DeviceID（伪装目标）
; 默认 (auto) 为全部
TargetDeviceId=auto
; 伪装的 GPU 名称
; NVIDIA GeForce RTX 4090 | Intel(R) Arc(TM) B580 Graphics | AMD Radeon RX 9070 XT
; 默认 (auto) 为 NVIDIA GeForce RTX 4090
SpoofedGPUName=auto
; 为 Streamline 启用 GPU 伪装，即使游戏其余部分禁用了 Dxgi 伪装
; 通常允许在不伪装整个游戏的情况下使用 Fakenvapi，有时也可以使用 DLSS/DLSSG
; true 或 false - 默认 (auto) 为 true
StreamlineSpoofing=auto
; 为 DXGI 启用 Nvidia GPU 伪装（可以在上面更改以伪装其他厂商）
; true 或 false - 默认 (auto) 为 AMD/Intel 是 true，Nvidia 是 false
Dxgi=auto
; 启用 DxgiFactory 的包装而不是挂钩
; 可能导致问题，或帮助 Nvidia 显卡配合其他模组
; true 或 false - 默认 (auto) 为 false
DxgiFactoryWrapping=auto
; 当调用者方法在列表中时跳过 DXGI GPU 伪装（示例：slInit|slGetPluginFunction|nvapi_QueryInterface）
; 注意：这将禁用其余调用的伪装，且在 Linux 上无效
; 方法名用竖线 "|" 分隔 - 默认 (auto) 为禁用
DxgiBlacklist=auto
; 伪装的 DXGI 显存大小
; 伪装的 GB 数 - 默认 (auto) 为禁用
DxgiVRAM=auto
; 为 Vulkan 启用 Nvidia GPU 伪装（可以在上面更改以伪装其他厂商）
; true 或 false - 默认 (auto) 为 false
Vulkan=auto
; 为 Vulkan 启用 Nvidia 扩展伪装
; true 或 false - 默认 (auto) 为 false
VulkanExtensionSpoofing=auto
; 伪装的 Vulkan 显存大小
; 伪装的 GB 数 - 默认 (auto) 为禁用
VulkanVRAM=auto
; 启用硬件加速 GPU 调度的伪装
; Nukem 的模组需要此项，也让 RTX40xx 系列用户无需启用 HAGS 即可使用 DLSSG
; true 或 false - 默认 (auto) 为 false，除非启用了 DLSSG 模组
SpoofHAGS=auto
; 启用对请求的 D3D 功能级别的覆盖
; true 或 false - 默认 (auto) 为 false
D3DFeatureLevel=auto
; 防止 UE 游戏在 Intel 显卡上启用伪装时出现 "不支持 DirectX12" 错误
; true 或 false - 默认 (auto) 为 false
UEIntelAtomics=auto
; 在注册表级别伪装 Vendor ID、Device ID 和驱动版本
; true 或 false - 默认 (auto) 为 false
Registry=auto
; 要在注册表中伪装的驱动版本
; 字符串值 - 默认 (auto) 为 32.0.15.9155（Nvidia）
RegistryDriver=auto
; 在 User32 级别伪装 Vendor ID 和 Device ID
; true 或 false - 默认 (auto) 为 false
User32=auto

[Plugins]
; -------------------------------------------------------
; 搜索同名插件（dxgi.dll、winmm.dll 等）的路径
; 默认是 OptiDllPath 下的 plugins，即 ".\OptiScaler\plugins\"
Path=auto
; 让 OptiScaler 加载 plugins 文件夹中的 *.asi 文件
; true 或 false - 默认 (auto) 为 false
LoadAsiPlugins=auto
; 延迟注入 plugins 文件夹中延迟加载的 *.asi 文件
; 要延迟加载 ASI 插件，请在扩展名前添加 -loadlate 到文件名，例如 "myplugin-loadlate.asi"
; 秒为单位的整数值 - 默认 (auto) 为 30
LateAsiPluginsDelay=auto
; 从游戏 exe 文件夹加载 SpecialK64.dll
; 请在 SpecialK64.dll 旁边创建一个空的 SpecialK.dxgi 文件
; 以设置 SpecialK 的工作模式，否则不会激活
; 由于稳定性问题，启用 OPTIFG、通过 SL 的 DLSSG 或 FSR-FG 输入时不会加载
; true 或 false - 默认 (auto) 为 false
LoadSpecialK=auto
; 从游戏 exe 文件夹加载 Reshade64.dll
; 将 Reshade dll 重命名为 ReShade64.dll，放在 OptiScaler 旁边并设为 true
; true 或 false - 默认 (auto) 为 false
LoadReshade=auto
; 为所有检测到的 RDNA 2 GPU 加载自定义 amdxc64.dll
; OptiScaler 从 OptiDllPath 加载它，例如 ".\OptiScaler\amdxc64.dll"
; true 或 false - 默认 (auto) 为 false
LoadCustomAmdxc64OnRdna2=auto

[fakenvapi]
; -------------------------------------------------------
; 当 nvapi64.dll 缺失时使用 fakenvapi。
; fakenvapi 替换 nvapi 调用，允许 AntiLag 2 或 XeLL 等功能替代 Reflex
; 有时也是 DLSS/DLSSG 出现所必需的
; true 或 false - 默认 (auto) 为 true
UseFakenvapi=auto
; 允许 XeLL 在非 Intel 显卡上无需 FG 工作，需要更新的 libxell + libxess_fg
; 禁用 FG 选项
; true 或 false - 默认 (auto) 为 false
ForceXeLL=auto
; 即使有更好的选项可用，也尝试使用 LatencyFlex
; 使用 XeFG 时不生效
; true 或 false - 默认 (auto) 为 false
ForceLatencyFlex=auto
; 控制 latencyflex 的工作方式
; 0 = 保守
; 1 = 激进，会改善延迟，但在某些情况下 FPS 下降会超过预期
; 2 = 使用 reflex frame ids，部分游戏不兼容（如 cyberpunk），将回退到激进模式
; 默认 (auto) 为 0
LatencyFlexMode=auto
; 强制 Reflex 状态，适用于只在使用 DLSSG 时启用 Reflex 而没有单独开关的游戏
; 0 - 跟随游戏内设置，1 - 强制禁用，2 - 强制启用
; 默认 (auto) 为 0
ForceReflex=auto

[NvApi]
; -------------------------------------------------------
; 禁用 FlipMetering
; 修复使用 NukemFG 时 Nvidia Flip Metering 导致的粗帧时间图，需要 Fakenvapi 才能工作
; true 或 false - 默认 (auto) 为 Nvidia 是 false，其他是 true
DisableFlipMetering=auto

[Dx11withDx12]
; -------------------------------------------------------
; 延迟 D11wDx12 功能创建期间的某些操作以提高兼容性
; true 或 false - 默认 (auto) 为 false
UseDelayedInit=auto
; 优先使用 D3D11_RESOURCE_MISC_SHARED，级别更低
; 性能稍好，兼容性可能稍差
; true 或 false - 默认 (auto) 为 true
DontUseNTShared=auto

[Hooks]
; -------------------------------------------------------
; 内核方法的早期挂钩
; 可能导致兼容性问题！！！
; true 或 false - 默认 (auto) 为 false
EarlyHooking=auto
; 跳过挂钩本地 nvngx 文件，只在注册表挂钩 nvngx
; Uniscaler + FG 需要
; true 或 false - 默认 (auto) 为 false
HookOriginalNvngxOnly=auto
; 只挂钩 ntdll.dll 方法，跳过 kernel32.dll 和 kernelbase.dll 的挂钩
; true 或 false - 默认 (auto) 为 true
UseNtdllHooks=auto

[Sharpness]
; -------------------------------------------------------
; 选项有：
; RCAS - AMD 的鲁棒对比度自适应锐化
; DA - 启用基于深度的边缘检测进行锐化。
;      减少物体边界处的锐化，防止光晕和伪影。
;      物体越远，应用的锐化越多（限制为 1.0）
;      推荐用于复杂几何场景或超分辨率。
; LCDA - 上述 DA 的局部对比度版本
; rcas, da 或 lcda - 默认 (auto) 为 rcas
Shader=auto
; 用固定锐化值覆盖 DLSS 锐化参数
; true 或 false - 默认 (auto) 为 false
OverrideSharpness=auto
; 锐化强度，
; 值范围 0.0 到 1.0（使用上限时 RCAS 为 1.3）- 默认 (auto) 为 0.3
Sharpness=auto

[OutputScaling]
; -------------------------------------------------------
; 启用放大镜
; 默认情况下，仅在菜单可见时可见并跟随光标
; true 或 false - 默认 (auto) 为 true
Enabled=auto
; 输出缩放比例
; 0.5 - 3.0 - 默认 (auto) 为 1.5
Multiplier=auto
; 输出缩放使用的降采样器
; 0 = FSR1 | 1 = Bicubic | 2 = Catmull-Rom | 3 = Lanczos2 | 4 = Lanczos3 | 5 = Kaiser2 | 6 = Kaiser3 | 7 = MAGIC
; 0 到 7 - 默认 (auto) 为 0 (FSR1)
Downscaler=auto

[CAS]
; -------------------------------------------------------
; 启用放大镜
; 默认情况下，仅在菜单可见时可见并跟随光标
; true 或 false - 默认 (auto) 为 true
Enabled=auto
; 启用运动锐化
; true 或 false - 默认 (auto) 为 false
MotionSharpnessEnabled=auto
; 根据运动长度增加或减少锐化
; 值范围 -1.3 到 1.3 - 默认 (auto) 为 0.4
MotionSharpness=auto
; 像素移动多少后才应用运动锐化
; 0.0 - 100.0 - 默认 (auto) 为 0.0
MotionThreshold=auto
; 像素移动多少才能达到最大 MotionSharpness 值
; MotionThreshold 与该值之间的值将用于缩放锐化值
; 0.0 - 100.0 - 默认 (auto) 为 10.0
MotionScaleLimit=auto
; 启用基于对比度的锐化
; 增加高对比度区域的锐度。
; true 或 false - 默认 (auto) 为 false
ContrastEnabled=auto
; 基于对比度的锐化值
; 较高的值会增加高对比度区域的锐度。
; 与高锐化值一起使用时，高值可能导致图形故障！！！
; 0.0 - 2.0 - 默认 (auto) 为 0.0
Contrast=auto
; 启用运动/DA 锐化的调试高亮
; 红色调表示增加，绿色调表示减少的锐化
; 深度感知锐化中检测到的边缘显示蓝色调
; true 或 false - 默认 (auto) 为 false
SharpenerDebug=auto
; 控制锐化在深度边缘处减少的强度。
; 较高的值更积极地阻止物体边界处的锐化（减少光晕）。
; 较低的值允许更多跨边缘锐化（更锐利，但风险更大）。
; 2.0 - 600.0 - 默认 (auto) 为 4.0
DADepthScale=auto
; 忽略边缘检测前的小深度差异。
; 较高的值减少微小深度变化带来的噪声和闪烁。
; 较低的值保留精细细节，但可能对深度噪声产生反应。
; 0.005 - 0.03 - 默认 (auto) 为 0.01
DADepthBias=auto
; 将最终图像限制在 [0, 1] 范围内。
; 防止过冲伪影，如明亮光晕或负色。
; 推荐用于 LDR 管线；HDR 可选，取决于色调映射。
; true 或 false - 默认 (auto) 为 false
DAClampOutput=auto

[Magnifier]
; -------------------------------------------------------
; 启用放大镜
; 默认情况下，仅在菜单可见时可见并跟随光标
; true 或 false - 默认 (auto) 为 true
Enabled=auto
; 放大镜半径，为屏幕高度的百分比
; float - 默认 (auto) 为 15.0
Size=auto
; 放大镜的缩放倍数
; 2 - 20 - 默认 (auto) 为 4
ZoomFactor=auto
; 放大镜的黑色边框宽度，为屏幕高度的百分比
; 0.0 - 2.0 - 默认 (auto) 为 0.3
BorderSize=auto
; 放大镜相对于鼠标位置的位置偏移，以像素为单位
; -1000 - 1000 - 默认 (auto) 为 0
CursorOffsetX=auto
CursorOffsetY=auto
; 放大镜的静态位置，为屏幕的百分比
; 两个值都设置后，放大镜将切换到静态模式
; 静态模式下，即使菜单不可见，放大镜也始终可见
; 0 - 100 - 默认 (auto) 为无
StaticPosX=auto
StaticPosY=auto

[Log]
; -------------------------------------------------------
; 是否创建日志文件
; true 或 false - 默认 (auto) 为 false
LogToFile=auto
; 文件日志的详细级别
; 0 = Trace / 1 = Debug / 2 = Info / 3 = Warning / 4 = Error
; 默认 (auto) 为 0 = Trace
LogLevel=auto
; 输出日志到控制台（出于性能原因，日志级别始终为 2 (Info)）
; true 或 false - 默认 (auto) 为 false
LogToConsole=auto
; 输出日志到 NVNGX API
; true 或 false - 默认 (auto) 为 false
LogToNGX=auto
; 输出日志到调试输出
; true 或 false - 默认 (auto) 为 false
LogToDebug=auto
; 打开用于查看日志的控制台窗口
; true 或 false - 默认 (auto) 为 false
OpenConsole=auto
; 设置为 false 时，每次 OptiScaler 会话都会创建新的日志文件
; true 或 false - 默认 (auto) 为 true
SingleFile=auto
; 自定义日志文件名
; 你也可以为日志指定自定义*路径*
; 默认 (auto) 为当前文件夹中的 OptiScaler.log
LogFileName=auto
; 启用异步日志
; true 或 false - 默认 (auto) 为 true
LogAsync=auto
; 异步日志线程数
; 1 - 8 - 默认 (auto) 为 1
LogAsyncThreads=auto

[InitFlags]
; -------------------------------------------------------
; 强制向初始化标志添加 ENABLE_AUTOEXPOSURE
; 部分 Unreal Engine 游戏需要此项，可修复颜色问题，尤其是在黑暗区域
; true 或 false - 默认 (auto) 为 DLSS 默认值
AutoExposure=auto
; 强制向初始化标志添加 HDR_INPUT_COLOR
; true 或 false - 默认 (auto) 为 DLSS 默认值
HDR=auto
; 强制向初始化标志添加 INVERTED_DEPTH
; true 或 false - 默认 (auto) 为 DLSS 默认值
DepthInverted=auto
; 强制向初始化标志添加 JITTERED_MV
; true 或 false - 默认 (auto) 为 DLSS 默认值
JitterCancellation=auto
; 强制向初始化标志添加 HIGH_RES_MV
; true 或 false - 默认 (auto) 为 DLSS 默认值
DisplayResolution=auto
; 强制从初始化标志中移除 RESPONSIVE_PIXEL_MASK
; true 或 false - 默认 (auto) 为 true
DisableReactiveMask=auto

[UpscaleRatio]
; -------------------------------------------------------
; 设为 true 以启用内部分辨率覆盖
; true 或 false - 默认 (auto) 为 false
UpscaleRatioOverrideEnabled=auto
; 设置强制缩放比例值
; 默认 (auto) 为 1.3
UpscaleRatioOverrideValue=auto

[QualityOverrides]
; -------------------------------------------------------
; 设为 true 以启用自定义质量模式覆盖
; true 或 false - 默认 (auto) 为 false
QualityRatioOverrideEnabled=auto
; 为每个质量模式设置自定义缩放比例
;
; 默认 (auto) 值：
; DLAA					: 1.0
; Ultra Quality         : 1.3
; Quality               : 1.5
; Balanced              : 1.7
; Performance           : 2.0
; Ultra Performance     : 3.0
QualityRatioDLAA=auto
QualityRatioUltraQuality=auto
QualityRatioQuality=auto
QualityRatioBalanced=auto
QualityRatioPerformance=auto
QualityRatioUltraPerformance=auto

[DRS]
; -------------------------------------------------------
; 设为 true 以启用将 DRS 最小分辨率限制为渲染分辨率
; true 或 false - 默认 (auto) 为 false
DrsMinOverrideEnabled=auto
; 设为 true 以启用将 DRS 最大分辨率限制为渲染分辨率
; true 或 false - 默认 (auto) 为 false
DrsMaxOverrideEnabled=auto

[HDR]
; -------------------------------------------------------
; 强制 HDR 色彩空间
; true 或 false - 默认 (auto) 为 false
ForceHDR=auto
; 使用 HDR10
; DXGI_FORMAT_R10G10B10A2_UNORM 而不是 DXGI_FORMAT_R16G16B16A16_FLOAT
; true 或 false - 默认 (auto) 为 false
UseHDR10=auto
; 跳过设置 HDR 色彩空间
; true 或 false - 默认 (auto) 为 false
SkipColorSpace=auto

[V-Sync]
; -------------------------------------------------------
; 启用 V-Sync 控制
; true 或 false - 默认 (auto) 为 false
OverrideVsync=auto
; 强制 V-Sync 值
; true 或 false - 默认 (auto) 为未选择
ForceVsync=auto
; V-Sync 的同步间隔值
; 0 到 3 - 默认 (auto) 为未选择
SyncInterval=auto

[Anisotropy]
; -------------------------------------------------------
; 覆盖纹理的最大各向异性/各向异性过滤
; 2, 4, 8, 16 - 默认 (auto) 为禁用
AnisotropyOverride=auto
; 将比较过滤器改为各向异性
; true 或 false - 默认 (auto) 为 true
ModifyComparison=auto
; 将 min/max 过滤器改为各向异性
; true 或 false - 默认 (auto) 为 true
ModifyMinMax=auto
; 跳过对点过滤器的覆盖
; true 或 false - 默认 (auto) 为 true
SkipPointFilter=auto

[Mipmap]
; -------------------------------------------------------
; Mipmap LOD 偏移的覆盖值
; -15.0 - 15.0 - 默认 (auto) 为禁用
MipmapBiasOverride=auto
; 对 LOD 偏移使用固定值
; true 或 false - 默认 (auto) 为 false
MipmapBiasFixedOverride=auto
; 将覆盖值用作缩放倍数
; true 或 false - 默认 (auto) 为 false
MipmapBiasScaleOverride=auto
; 覆盖所有纹理的 LOD 偏移（通常只覆盖 < 0 的值）
; true 或 false - 默认 (auto) 为 false
MipmapBiasOverrideAll=auto

[ProcessFilter]
; -------------------------------------------------------
; 只注入到此特定进程（不区分大小写）
; 示例：TargetProcessName=endfield.exe
; 默认 (auto) 为禁用（注入所有进程）
TargetProcessName=auto
; 不注入到此特定进程（不区分大小写）
; 进程名用竖线 "|" 分隔 - 默认 (auto) 为
; crashpad_handler.exe 等 - 列在 Config.h 的 ProcessFilter 下
ProcessExclusionList=auto

[Hotfix]
; -------------------------------------------------------
; 启用从 Github 检查最新版本
; true 或 false - 默认 (auto) 为 true
CheckForUpdate=auto
; 启用阻止 Steam 和 Epic 覆盖层
; 也会阻止 Steam Input
; true 或 false - 默认 (auto) 为 false，OptiFG 启用时除外（此时为 true）
DisableOverlays=auto
; 使用手动输入轮询而不是挂钩 WndProc
; 可能帮助无法正确捕获输入的游戏
; 缺点是菜单打开时将无法阻止输入
; true 或 false - 默认 (auto) 为 false
ManualInputPolling=auto
; 模拟 FG swapchain 的可等待对象事件信号
; true 或 false - 默认 (auto) 为 false
SimulateWaitableObject=auto
; OptiScaler 将延迟加载 Reshade 并先创建 D3D12 设备
; 此选项将防止与 Luma 和其他一些 ReShade 模组的警告/崩溃
; 使用 Luma 模组时请启用此项
; true 或 false - 默认 (auto) 为 false
CreateD3D12DeviceForLuma=auto
; OptiScaler 将尝试强制使用高性能 GPU
; true 或 false - 默认 (auto) 为 false
PreferDedicatedGpu=auto
; OptiScaler 将只报告第一个高性能 GPU
; true 或 false - 默认 (auto) 为 false
PreferFirstDedicatedGpu=auto
; 将内部分辨率的宽高四舍五入为该值的倍数
; 2, 4, 8, 16 ... - 默认 (auto) 为禁用
RoundInternalResolution=auto
; 跳过 n 帧的超分辨率
; n 为整数 - 默认 (auto) 为禁用
SkipFirstFrames=auto
; 超分辨率后恢复上一次使用的计算签名
; true 或 false - 默认 (auto) 为 false
RestoreComputeSignature=auto
; 超分辨率后恢复上一次使用的图形签名
; true 或 false - 默认 (auto) 为 false
RestoreGraphicSignature=auto
; 尝试跟踪签名更改以完全恢复它们
; 对使用 bindless 的游戏有用
; true 或 false - 默认 (auto) 为 false
ExtendedStateRestore=auto
; 为 RCAS、输出缩放和 Mask Bias 使用预编译着色器
; true 或 false - 默认 (auto) 为 true
UsePrecompiledShaders=auto
; 颜色纹理资源状态修正，修复 AMD 显卡上的彩虹色问题（主要针对 UE 游戏）
; 对于 UE 引擎游戏和 AMD 显卡，将 Color 设置为 4 (D3D12_RESOURCE_STATE_RENDER_TARGET)
ColorResourceBarrier=auto
; 对于 UE 引擎游戏和 AMD 显卡，将 MotionVector 设置为 8 (D3D12_RESOURCE_STATE_UNORDERED_ACCESS)
MotionVectorResourceBarrier=auto
DepthResourceBarrier=auto
ColorMaskResourceBarrier=auto
ExposureResourceBarrier=auto
OutputResourceBarrier=auto
