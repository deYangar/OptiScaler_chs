name: CHS Sync & Release

on:
  schedule:
    - cron: '0 20 * * *'         # 每天 20:00 UTC (04:00 北京) 自动 Nightly
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型（auto=自动判断：上游有新正式版则发正式版，否则 nightly）'
        type: choice
        options: [auto, nightly, beta, release]
        default: auto
      sync_upstream:
        description: '先同步上游最新源码到本仓库'
        type: boolean
        default: true
      build_only:
        description: '只构建（跳过同步，直接用仓库现有代码编译）'
        type: boolean
        default: false
  push:
    paths: ['overlay/**', 'scripts/**']

permissions:
  contents: write

env:
  UPSTREAM_REPO: optiscaler/OptiScaler
  FONT_DEB: http://deb.debian.org/debian/pool/main/f/fonts-wqy-microhei/fonts-wqy-microhei_0.2.0-beta-4_all.deb

jobs:
  sync:
    name: 同步上游 + 自动翻译
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.ver.outputs.tag }}
      release_type: ${{ steps.ver.outputs.type }}
      build_required: ${{ steps.check.outputs.required }}
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确定发布类型与 tag
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 手动触发时：尊重 release_type 输入
          INPUT_TYPE="${{ github.event.inputs.release_type || '' }}"
          UPSTREAM_REPO="${{ env.UPSTREAM_REPO }}"
          MINE="${{ github.repository }}"

          # 获取上游最新正式版 tag（如 v0.9.4）
          UPSTREAM_STABLE=$(gh api repos/$UPSTREAM_REPO/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          echo "上游最新正式版: ${UPSTREAM_STABLE:-无}"

          if [ "$INPUT_TYPE" = "nightly" ]; then
            TYPE="nightly"; TAG="nightly"
          elif [ "$INPUT_TYPE" = "beta" ]; then
            TYPE="beta"; TAG="beta"
          elif [ "$INPUT_TYPE" = "release" ]; then
            # 手动指定正式版：tag 用上游最新正式版版本号（未发布过则用日期）
            if [ -n "$UPSTREAM_STABLE" ]; then
              TYPE="release"; TAG="$UPSTREAM_STABLE"
            else
              TYPE="release"; TAG="release-$(date +%Y%m%d)"
            fi
          else
            # auto / 定时 / 推送触发：自动判断
            # 上游有新正式版且本仓库未发布过 -> 发正式版；否则 -> nightly
            ALREADY=""
            if [ -n "$UPSTREAM_STABLE" ]; then
              ALREADY=$(gh release view "$UPSTREAM_STABLE" --repo "$MINE" --json tagName --jq '.tagName' 2>/dev/null || echo "")
            fi
            if [ -n "$UPSTREAM_STABLE" ] && [ -z "$ALREADY" ]; then
              TYPE="release"; TAG="$UPSTREAM_STABLE"
              echo "发现上游新正式版 $TAG，本次发布正式版"
            else
              TYPE="nightly"; TAG="nightly"
              echo "无上游新正式版，本次发布 nightly"
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "TYPE=$TYPE" >> $GITHUB_ENV
          echo "本次发布: type=$TYPE tag=$TAG"

      - name: 同步上游源码到本仓库
        id: sync_up
        if: github.event.inputs.build_only != 'true' && github.event.inputs.sync_upstream != 'false'
        run: |
          git config user.name "deYangar"
          git config user.email "70438628+deYangar@users.noreply.github.com"
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || true
          git fetch upstream master --depth 50
          echo "上游 HEAD: $(git rev-parse upstream/master)"

          # 只同步上游的源码路径，保留我们的 overlay/ scripts/ fonts/ .github/ 等汉化资产
          # ⚠️ 以下中文文档已汉化，禁止从上游覆盖：README.md Config.md CONTRIBUTING.md Features.md Issues.md Spoofing.md OptiScaler.ini setup_windows.bat
          # 核心路径（上游必有），缺失即报错
          git checkout upstream/master -- \
            OptiScaler/ external/ images/ \
            OptiScaler.sln Changelog.md \
            LICENSE \
            setup_linux.sh \
            .clang-format .gitattributes .gitignore .gitmodules
          # 兼容：上游新出现的目录也同步（存在才拉，避免 pathspec 报错）
          for d in run overlay_dev; do
            if git cat-file -e upstream/master:$d 2>/dev/null; then
              git checkout upstream/master -- $d
            fi
          done

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: 同步上游源码 $(date +%Y%m%d) [skip ci]"
            git push origin master
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ 已同步上游并推送"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 上游无变化，跳过提交"
          fi

      - name: 扫描新字符串
        id: scan
        if: github.event.inputs.build_only != 'true'
        run: |
          python scripts/scan_strings.py "$GITHUB_WORKSPACE" --output pending.json || true
          if [ -s pending.json ]; then
            CNT=$(python -c "import json;print(len(json.load(open('pending.json'))))")
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "新增待翻译字符串: $CNT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "无新增字符串"
          fi

      - name: 自动翻译（DeepSeek）
        if: steps.scan.outputs.has_new == 'true' && env.DEEPSEEK_API_KEY != '' && github.event.inputs.build_only != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/translate.py --input pending.json
          git config user.name "deYangar"
          git config user.email "70438628+deYangar@users.noreply.github.com"
          git add overlay/ scripts/strings_map.json
          git commit -m "chore: 自动翻译新增字符串 $(date +%Y%m%d) [skip ci]" || echo "无变更"
          git push origin master || echo "push 失败（可忽略）"

      - name: 同步汉化文档（ini 增量合并 + md 变更检测）
        id: docs
        if: github.event.inputs.build_only != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/sync_docs.py --repo "$GITHUB_WORKSPACE" --api-key "$DEEPSEEK_API_KEY"
          EXIT=$?
          if [ $EXIT -eq 2 ]; then
            git config user.name "deYangar"
            git config user.email "70438628+deYangar@users.noreply.github.com"
            git add -A
            git commit -m "chore: 同步上游文档更新 $(date +%Y%m%d) [skip ci]" || echo "无变更"
            git push origin master || echo "push 失败（可忽略）"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ 已同步上游文档更新"
          elif [ $EXIT -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 上游文档无变化"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ sync_docs 异常退出 ($EXIT)，继续流程"
          fi

      - name: 同步汉化 setup_windows.bat（增量）
        id: bat
        if: github.event.inputs.build_only != 'true'
        run: |
          python scripts/translate_setup_bat.py --repo "$GITHUB_WORKSPACE"
          EXIT=$?
          if [ $EXIT -eq 2 ]; then
            git config user.name "deYangar"
            git config user.email "70438628+deYangar@users.noreply.github.com"
            git add setup_windows.bat docs/upstream_ref/setup_windows.bat
            git commit -m "chore: 同步上游 setup_windows.bat 更新并重新汉化 $(date +%Y%m%d) [skip ci]" || echo "无变更"
            git push origin master || echo "push 失败（可忽略）"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ 已同步并汉化 setup_windows.bat"
          elif [ $EXIT -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 上游 setup_windows.bat 无变化"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ translate_setup_bat 异常退出 ($EXIT)，继续流程"
          fi

      - name: 判断是否需要构建
        id: check
        run: |
          EVENT="${{ github.event_name }}"
          TYPE="${{ steps.ver.outputs.type }}"
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "push" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "触发方式: $EVENT，总是构建"
          elif [ "$TYPE" = "release" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "本次为正式版发布，构建"
          elif [ "${{ steps.sync_up.outputs.changed }}" = "true" ] || [ "${{ steps.scan.outputs.has_new }}" = "true" ] || [ "${{ steps.docs.outputs.changed }}" = "true" ] || [ "${{ steps.bat.outputs.changed }}" = "true" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "检测到实质变更（上游源码/新字符串/文档），构建"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "无任何变更，跳过构建与发布"
          fi

  build:
    name: Windows 编译
    needs: sync
    runs-on: windows-latest
    if: needs.sync.outputs.build_required == 'true'
    steps:
      - name: 检出本仓库（含源码 + submodule）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'true'

      - name: 注入汉化补丁
        run: |
          python scripts/apply_patch.py "$env:GITHUB_WORKSPACE"

      - name: 构建
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/build.ps1" -SourceDir "$env:GITHUB_WORKSPACE" -OutDir "$env:GITHUB_WORKSPACE/dist/CHS"

      - name: 打包 7z
        shell: pwsh
        run: |
          7z a -t7z -mx=9 "$env:GITHUB_WORKSPACE/dist/OptiScaler_CHS_${{ needs.sync.outputs.version_tag }}.7z" "$env:GITHUB_WORKSPACE/dist/CHS/*"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-7z
          path: dist/*.7z
          retention-days: 7

  release:
    name: 发布
    needs: [sync, build]
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'
    steps:
      - name: 下载 7z
        uses: actions/download-artifact@v4
        with:
          name: release-7z
          path: dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.sync.outputs.version_tag }}
          TYPE: ${{ needs.sync.outputs.release_type }}
        run: |
          ZIP=$(ls dist/*.7z | head -1)
          DATE=$(date +%Y-%m-%d)
          if [ "$TYPE" = "nightly" ]; then
            TITLE="Nightly $DATE"
            NOTES="自动构建的每日预览版（上游 master + 汉化）"
            PRERELEASE=true
          elif [ "$TYPE" = "beta" ]; then
            TITLE="Beta $DATE"
            NOTES="测试版（上游 master + 汉化）"
            PRERELEASE=true
          else
            TITLE="Release $TAG"
            NOTES="正式版（上游 $TAG + 汉化）"
            PRERELEASE=false
          fi
          # 固定 tag（nightly/beta/同名版本）需先删除旧 release+tag 再重建，保证链接始终有效
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$ZIP" --repo "${{ github.repository }}" --title "$TITLE" --notes "$NOTES" --prerelease="$PRERELEASE"
          echo "已发布: $TAG (type=$TYPE)"
